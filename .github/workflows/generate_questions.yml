name: Hourly Question Generator

on:
  schedule:
    # Runs at minute 0 past every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of questions to generate in this run'
        required: false
        default: '100'

jobs:
  generate-questions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install groq asyncpg

      - name: Run Question Seeder
        env:
          LAYER_BASE_CONNECTION_STRING: ${{ secrets.LAYER_BASE_CONNECTION_STRING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          QUESTION_GENERATION_BATCH_SIZE: ${{ inputs.batch_size || vars.QUESTION_GENERATION_BATCH_SIZE || '100' }}
        run: |
          python backend/scripts/seed_questions.py
